<div class="sql-editor-container">
  <h2>SQL Editor</h2>

  <div class="section">
    <app-table-selector (tableSelected)="handleTableSelected($event)">
    </app-table-selector>
  </div>

  <p *ngIf="selectedTable" class="selected-table">
    You selected: <strong>{{ selectedTable }}</strong>
  </p>

  <div class="section" *ngIf="selectedTable">
    <app-column-selector
      [tableName]="selectedTable"
      (columnsSelected)="handleColumnsSelected($event)">
    </app-column-selector>
  </div>

  <div class="section" *ngIf="selectedColumns.length > 0">
    <app-condition-builder
      [columns]="selectedColumns"
      (conditionsChanged)="handleConditionsChanged($event)">
    </app-condition-builder>
  </div>

  <div class="button-container" *ngIf="selectedColumns.length > 0">
    <button (click)="generateSql()">Generate SQL</button>
  </div>

  <p *ngIf="loading" class="loading-text">
    Loading SQL templates, please wait...
  </p>

  <div class="section" *ngIf="!loading && sqlTemplates">
    <app-sql-template-display
      [tableName]="selectedTable"
      [sqlTemplates]="sqlTemplates">
    </app-sql-template-display>
  </div>
</div>
